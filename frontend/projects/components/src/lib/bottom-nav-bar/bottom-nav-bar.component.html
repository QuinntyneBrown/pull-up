<nav class="bottom-nav" data-pu="bottom-nav" role="navigation">
  @for (item of items; track item.route) {
    <a class="bottom-nav__item"
       [class.bottom-nav__item--active]="item.route === activeRoute"
       [routerLink]="item.route"
       [attr.aria-label]="item.label"
       [attr.aria-current]="item.route === activeRoute ? 'page' : null">
      <mat-icon class="bottom-nav__icon">{{ item.icon }}</mat-icon>
      <span class="bottom-nav__label">{{ item.label }}</span>
    </a>
  }
</nav>
