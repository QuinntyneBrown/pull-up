<div class="error-state" data-pu="error-state" role="alert">
  <mat-icon class="error-state__icon" aria-hidden="true">{{ icon }}</mat-icon>
  <h2 class="error-state__title">{{ title }}</h2>
  @if (supportingText) {
    <p class="error-state__supporting">{{ supportingText }}</p>
  }
  <button mat-stroked-button color="primary" (click)="onRetry()" data-testid="error-state-retry">
    {{ retryLabel }}
  </button>
</div>
