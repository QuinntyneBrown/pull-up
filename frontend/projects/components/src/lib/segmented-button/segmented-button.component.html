<div class="segmented" data-pu="segmented-button" role="radiogroup" [attr.aria-label]="ariaLabel || null">
  @for (option of options; track option.value) {
    <button type="button"
            class="segmented__option"
            [class.segmented__option--selected]="option.value === selected"
            role="radio"
            [attr.aria-checked]="option.value === selected"
            [attr.data-testid]="'segmented-' + option.value"
            (click)="onSelect(option.value)">
      @if (option.icon) {
        <mat-icon class="segmented__icon" aria-hidden="true">{{ option.icon }}</mat-icon>
      }
      <span class="segmented__label">{{ option.label }}</span>
    </button>
  }
</div>
