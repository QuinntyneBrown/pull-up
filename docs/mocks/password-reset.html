<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset password — Pull Up</title>
    <link rel="stylesheet" href="material3.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-card__brand">
          <span class="auth-card__logo">P</span>
          <h1 class="auth-card__brand-name">Pull Up</h1>
        </div>

        <h2 class="auth-card__heading">Reset your password</h2>
        <p class="auth-card__sub">Enter the email on your Pull Up account and we'll send a reset link.</p>

        <form>
          <label class="text-field">
            <span class="text-field__label">Email</span>
            <input class="text-field__input" type="email" value="rosa.marquez@example.com" />
          </label>

          <div class="auth-card__actions">
            <button type="button" class="btn btn--filled btn--full">Send reset link</button>
            <a class="btn btn--text" href="sign-in.html">Back to sign in</a>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
