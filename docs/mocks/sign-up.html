<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign up — Pull Up</title>
    <link rel="stylesheet" href="material3.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
        <div class="auth-card__brand">
          <span class="auth-card__logo">P</span>
          <h1 class="auth-card__brand-name">Pull Up</h1>
        </div>

        <h2 class="auth-card__heading">Create your account</h2>
        <p class="auth-card__sub">A free account is all you need to host and join events.</p>

        <form>
          <label class="text-field">
            <span class="text-field__label">Full name</span>
            <input class="text-field__input" type="text" value="Rosa Marquez" />
          </label>

          <label class="text-field">
            <span class="text-field__label">Email</span>
            <input class="text-field__input" type="email" value="rosa.marquez@example.com" />
          </label>

          <label class="text-field">
            <span class="text-field__label">Password</span>
            <input class="text-field__input" type="password" value="********" />
            <p class="text-field__supporting">At least 8 characters, one number, one symbol.</p>
          </label>

          <div class="auth-card__actions">
            <button type="button" class="btn btn--filled btn--full">Create account</button>
          </div>
        </form>

        <hr class="auth-card__divider" />

        <p class="auth-card__footer">
          Already have an account? <a href="sign-in.html">Sign in</a>
        </p>
      </div>
    </main>
  </body>
</html>
